plugins {
    id 'com.android.application'
}

android {
    namespace 'com.my.newproject' // Cambia esto por tu paquete real si es distinto
    compileSdk 34

    defaultConfig {
        applicationId "com.my.newproject"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
