plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tubevideos'
    compileSdk 34

    defaultConfig {
        applicationId "com.tubevideos"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Extractor local (Versión corregida sin la "v")
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:0.22.2'
    
    // Anuncios (AdMob)
    implementation 'com.google.android.gms:ads:22.6.0'
}
