<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeMusic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        h1 {
            color: #8B5CF6;
            font-size: 28px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #333333;
            background-color: #1e1e1e;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #8B5CF6;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: #8B5CF6;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:disabled {
            background-color: #4c3782;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 10px;
            padding: 14px;
            border-radius: 10px;
            background-color: #1e1e1e;
            font-size: 14px;
            color: #aaaaaa;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TubeMusic</h1>
        <input type="text" id="urlInput" placeholder="Pega el enlace de YouTube aquí...">
        <button id="btnDescargar" onclick="procesarUrl()">Descargar Audio</button>
        
        <div id="status" class="status-box">
            Inicializando motor local...
        </div>
    </div>

    <script>
        // Bloquea el botón al cargar hasta recibir confirmación del motor nativo
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('btnDescargar').disabled = true;
        });

        // Llamado desde MainActivity cuando YoutubeDL y FFmpeg están listos
        function motorListo() {
            document.getElementById('status').innerText = "Listo para descargar";
            document.getElementById('btnDescargar').disabled = false;
        }

        // Envía la URL hacia Java mediante AndroidBridge
        function procesarUrl() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();

            if (!url) {
                if (window.AndroidBridge) {
                    window.AndroidBridge.mostrarToast("Por favor ingresa una URL válida");
                } else {
                    alert("Por favor ingresa una URL válida");
                }
                return;
            }

            document.getElementById('btnDescargar').disabled = true;

            if (window.AndroidBridge) {
                window.AndroidBridge.iniciarDescarga(url);
            } else {
                actualizarProgreso(0, "Error: AndroidBridge no disponible");
            }
        }

        // Funciones de actualización invocadas desde evaluateJavascript en MainActivity
        function actualizarProgreso(porcentaje, mensaje) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = mensaje;
        }

        function descargaCompletada(mensaje) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "✓ " + mensaje;
            document.getElementById('btnDescargar').disabled = false;
            document.getElementById('urlInput').value = "";
        }

        function errorDescarga(mensajeError) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = mensajeError;
            document.getElementById('btnDescargar').disabled = false;
        }
    </script>
</body>
</html>
