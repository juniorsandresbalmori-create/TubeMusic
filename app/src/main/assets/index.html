<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeMusic</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra superior */
        .header {
            background-color: #9b51e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .header-icon {
            cursor: pointer;
            font-size: 22px;
            padding: 5px;
        }

        /* Contenedores de pantallas */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Inputs y Botones */
        input[type="text"] {
            width: 90%;
            max-width: 500px;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            outline: none;
        }

        button {
            width: 90%;
            max-width: 500px;
            padding: 15px;
            background: #9b51e0;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        button:active {
            background: #7a3bbb;
        }

        /* Menú de anuncios */
        #adMenu {
            display: none; 
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        #adMenu h3 {
            margin-bottom: 25px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .btn-volver {
            margin-top: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            color: #ccc;
            padding: 10px;
        }

        /* Mensaje emergente (Toast) interno */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 25px;
            padding: 12px;
            position: fixed;
            z-index: 10;
            bottom: 30px;
            font-size: 13px;
            border: 1px solid #555;
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }

        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

    <!-- Barra superior -->
    <div class="header">
        <span id="timerDisplay">00:04:10</span>
        <span class="header-icon" id="btnConfig">🔧</span>
    </div>

    <!-- Vista Principal: Descargas -->
    <div id="mainView" class="content">
        <input type="text" id="urlInput" placeholder="https://youtu.be/...">
        <button id="btnDescargar">DESCARGAR MP3</button>
    </div>

    <!-- Vista Secundaria: Menú de Anuncios -->
    <div id="adMenu" class="content">
        <h3>CONSEGUIR TIEMPO</h3>
        <button onclick="verAnuncio(15)">+15 SEGUNDOS (ANUNCIO CORTO)</button>
        <button onclick="verAnuncio(30)">+30 SEGUNDOS (ANUNCIO MEDIO)</button>
        <button onclick="verAnuncio(300)">+5 MINUTOS (ANUNCIO LARGO)</button>
        <button onclick="verAnuncio(1800)">+30 MINUTOS (PASE EXTENDIDO)</button>
        <button onclick="verAnuncio(3600)">+1 HORA (PASE PREMIUM)</button>
        
        <div class="btn-volver" id="btnVolver">VOLVER</div>
    </div>

    <!-- Toast de Notificaciones -->
    <div id="toast">Notificación</div>

    <script>
        // Variables de tiempo (segundos totales iniciales = 250 segundos = 00:04:10)
        let segundosRestantes = 250;
        let timerInterval = null;

        // Actualizar el formato visual HH:MM:SS
        function actualizarDisplay() {
            let hrs = Math.floor(segundosRestantes / 3600);
            let mins = Math.floor((segundosRestantes % 3600) / 60);
            let secs = segundosRestantes % 60;

            let formatted = 
                String(hrs).padStart(2, '0') + ":" +
                String(mins).padStart(2, '0') + ":" +
                String(secs).padStart(2, '0');

            document.getElementById('timerDisplay').innerText = formatted;
        }

        // Iniciar reloj
        function iniciarReloj() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (segundosRestantes > 0) {
                    segundosRestantes--;
                    actualizarDisplay();
                } else {
                    mostrarMensaje("¡Tiempo agotado! Mira un anuncio para continuar.");
                }
            }, 1000);
        }

        // Navegación entre pantallas
        document.getElementById('btnConfig').onclick = function() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('adMenu').style.display = 'flex';
        };

        document.getElementById('btnVolver').onclick = function() {
            document.getElementById('adMenu').style.display = 'none';
            document.getElementById('mainView').style.display = 'flex';
        };

        // Función para agregar tiempo con los anuncios
        function verAnuncio(segundosAñadidos) {
            segundosRestantes += segundosAñadidos;
            actualizarDisplay();
            mostrarMensaje("+" + segundosAñadidos + " segundos añadidos.");
            
            if (window.AndroidBridge && window.AndroidBridge.mostrarToast) {
                window.AndroidBridge.mostrarToast("Tiempo añadido correctamente.");
            }
        }

        // Función de descarga
        document.getElementById('btnDescargar').onclick = function() {
            let url = document.getElementById('urlInput').value.trim();

            if (!url) {
                mostrarMensaje("Ingresa un enlace de YouTube.");
                return;
            }

            if (segundosRestantes <= 0) {
                mostrarMensaje("Sin tiempo disponible. Mira un anuncio.");
                return;
            }

            mostrarMensaje("Iniciando descarga en segundo plano...");

            if (window.AndroidBridge) {
                if (window.AndroidBridge.iniciarDescarga) {
                    window.AndroidBridge.iniciarDescarga(url);
                } else if (window.AndroidBridge.mostrarToast) {
                    window.AndroidBridge.mostrarToast("Iniciando descarga de: " + url);
                }
            }
        };

        // Cartel emergente visual
        function mostrarMensaje(texto) {
            let toast = document.getElementById('toast');
            toast.innerText = texto;
            toast.className = "toast show";
            setTimeout(() => { 
                toast.className = toast.className.replace("show", ""); 
            }, 2800);
        }

        // Iniciar al cargar
        actualizarDisplay();
        iniciarReloj();
    </script>
</body>
    </html>
