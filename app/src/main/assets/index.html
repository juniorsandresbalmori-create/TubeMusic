<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeMusic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .header-bar { background-color: #8b5cf6; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 18px; }
    .icon-btn { background: none; border: none; color: #ffffff; font-size: 22px; cursor: pointer; }

    .view-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 20px; }
    .download-box { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }

    .search-input { width: 100%; padding: 14px 16px; background-color: #242424; border: 1px solid #333333; border-radius: 4px; color: #ffffff; font-size: 14px; outline: none; }
    .search-input::placeholder { color: #71717a; }

    .download-btn { width: 100%; padding: 14px; background-color: #8b5cf6; color: #ffffff; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .download-btn:disabled { background-color: #4c1d95; color: #888; cursor: not-allowed; }

    /* Barra de progreso morada animada */
    .progress-box { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .progress-track { width: 100%; height: 8px; background-color: #242424; border-radius: 4px; overflow: hidden; }
    .progress-fill { width: 100%; height: 100%; background-color: #8b5cf6; border-radius: 4px; animation: pulse 1.2s infinite ease-in-out; }
    .progress-text { font-size: 12px; color: #a1a1aa; text-align: center; }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    .menu-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; gap: 12px; }
    .menu-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }

    .pill-btn { width: 100%; max-width: 420px; padding: 14px 20px; background-color: #8b5cf6; color: #ffffff; border: none; border-radius: 25px; font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; text-align: center; }
    .pill-btn:active { background-color: #7c3aed; }
    .volver-btn { background: none; border: none; color: #a1a1aa; font-size: 13px; font-weight: bold; margin-top: 15px; cursor: pointer; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="header-bar">
    <span id="timerText">00:04:24</span>
    <button class="icon-btn" id="openMenuBtn">🔧</button>
  </header>

  <!-- Vista Principal -->
  <main id="mainView" class="view-container">
    <div class="download-box">
      <input type="text" id="urlInput" class="search-input" placeholder="Pegar enlace o buscar..." />
      <button id="downloadBtn" class="download-btn">DESCARGAR MP3</button>

      <!-- Indicador de Carga Morado -->
      <div id="progressBox" class="progress-box hidden">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <span id="progressText" class="progress-text">Procesando audio MP3...</span>
      </div>
    </div>
  </main>

  <!-- Menú Conseguir Tiempo -->
  <main id="menuView" class="menu-container hidden">
    <h2 class="menu-title">CONSEGUIR TIEMPO</h2>

    <button class="pill-btn" onclick="solicitarAnuncio(15)">+15 SEGUNDOS (ANUNCIO CORTO)</button>
    <button class="pill-btn" onclick="solicitarAnuncio(30)">+30 SEGUNDOS (ANUNCIO MEDIO)</button>
    <button class="pill-btn" onclick="solicitarAnuncio(300)">+5 MINUTOS (ANUNCIO LARGO)</button>
    <button class="pill-btn" onclick="solicitarAnuncio(1800)">+30 MINUTOS (PASE EXTENDIDO)</button>
    <button class="pill-btn" onclick="solicitarAnuncio(3600)">+1 HORA (PASE PREMIUM)</button>

    <button id="closeMenuBtn" class="volver-btn">VOLVER</button>
  </main>

  <script>
    let tiempoRestante = 264; 

    const timerText = document.getElementById('timerText');
    const mainView = document.getElementById('mainView');
    const menuView = document.getElementById('menuView');
    const downloadBtn = document.getElementById('downloadBtn');
    const progressBox = document.getElementById('progressBox');
    const progressText = document.getElementById('progressText');

    function actualizarRelojUI() {
      const horas = Math.floor(tiempoRestante / 3600);
      const minutos = Math.floor((tiempoRestante % 3600) / 60);
      const segundos = tiempoRestante % 60;

      const hStr = String(horas).padStart(2, '0');
      const mStr = String(minutos).padStart(2, '0');
      const sStr = String(segundos).padStart(2, '0');

      timerText.textContent = `${hStr}:${mStr}:${sStr}`;

      if (tiempoRestante <= 0) {
        downloadBtn.disabled = true;
        downloadBtn.textContent = "SIN TIEMPO DISPONIBLE";
      } else if (!downloadBtn.dataset.cargando) {
        downloadBtn.disabled = false;
        downloadBtn.textContent = "DESCARGAR MP3";
      }
    }

    setInterval(() => {
      if (tiempoRestante > 0) {
        tiempoRestante--;
        actualizarRelojUI();
      }
    }, 1000);

    function sumarTiempo(segundos) {
      tiempoRestante += segundos;
      actualizarRelojUI();
    }

    function solicitarAnuncio(segundos) {
      if (window.AndroidBridge) {
        window.AndroidBridge.verAnuncioPorTiempo(segundos);
      } else {
        sumarTiempo(segundos);
      }
    }

    function mostrarCargando(mensaje) {
      progressText.textContent = mensaje || "Procesando audio MP3...";
      progressBox.classList.remove('hidden');
      downloadBtn.disabled = true;
      downloadBtn.dataset.cargando = "true";
    }

    function ocultarCargando() {
      progressBox.classList.add('hidden');
      delete downloadBtn.dataset.cargando;
      actualizarRelojUI();
    }

    downloadBtn.addEventListener('click', () => {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) {
        alert("Ingresá un enlace válido.");
        return;
      }
      if (tiempoRestante > 0) {
        mostrarCargando("Iniciando procesamiento...");
        if (window.AndroidBridge) {
          window.AndroidBridge.procesarDescarga(url);
        } else {
          setTimeout(() => ocultarCargando(), 3000);
        }
      }
    });

    document.getElementById('openMenuBtn').addEventListener('click', () => {
      mainView.classList.add('hidden');
      menuView.classList.remove('hidden');
    });

    document.getElementById('closeMenuBtn').addEventListener('click', () => {
      menuView.classList.add('hidden');
      mainView.classList.remove('hidden');
    });

    actualizarRelojUI();
  </script>
</body>
</html>
