<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeMusic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Barra superior morada */
    .header-bar {
      background-color: #8b5cf6;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      font-size: 18px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
    }

    /* Contenido centrado */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
    }

    .download-box {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Campo de texto gris oscuro */
    .search-input {
      width: 100%;
      padding: 14px 16px;
      background-color: #242424;
      border: 1px solid #333333;
      border-radius: 4px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .search-input::placeholder {
      color: #71717a;
    }

    /* Botón morado */
    .download-btn {
      width: 100%;
      padding: 14px;
      background-color: #8b5cf6;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .download-btn:active {
      background-color: #7c3aed;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <span>TubeMusic</span>
    <button class="icon-btn">🔧</button>
  </header>

  <main class="main-content">
    <div class="download-box">
      <input type="text" id="urlInput" class="search-input" placeholder="Pegar enlace o buscar..." />
      <button id="downloadBtn" class="download-btn">DESCARGAR MP3</button>
    </div>
  </main>

  <script>
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const url = document.getElementById('urlInput').value.trim();
      if (url) {
        // Aquí conectás la lógica JS que procesa la descarga del MP3
        console.log("Procesando descarga para:", url);
      }
    });
  </script>

</body>
</html>
