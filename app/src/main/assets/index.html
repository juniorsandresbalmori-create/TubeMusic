<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeMusic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f13;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #1a1a24;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #bb86fc;
        }

        p {
            font-size: 0.9rem;
            color: #a0a0b0;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333345;
            background-color: #0f0f13;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #bb86fc;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: #bb86fc;
            color: #000000;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
            background-color: #9955e8;
        }

        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #03dac6;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TubeMusic</h1>
        <p>Ingresa el enlace de YouTube para descargar el audio</p>

        <div class="input-group">
            <input type="text" id="youtubeUrl" placeholder="https://youtu.be/..." autocomplete="off">
            <button onclick="procesarDescarga()">Descargar Audio</button>
        </div>

        <div id="status" class="status-msg"></div>
    </div>

    <script>
        function procesarDescarga() {
            const urlInput = document.getElementById('youtubeUrl').value.trim();
            const statusDiv = document.getElementById('status');

            if (!urlInput) {
                statusDiv.style.color = '#cf6679';
                statusDiv.innerText = 'Por favor, pega un enlace válido.';
                return;
            }

            statusDiv.style.color = '#03dac6';
            statusDiv.innerText = 'Enviando a procesar...';

            // Comprobar la disponibilidad del puente de Android
            if (typeof AndroidBridge !== 'undefined' && AndroidBridge.startDownload) {
                AndroidBridge.startDownload(urlInput);
                document.getElementById('youtubeUrl').value = '';
            } else {
                statusDiv.style.color = '#cf6679';
                statusDiv.innerText = 'Error: Conexión con Android no disponible.';
            }
        }
    </script>

</body>
</html>
