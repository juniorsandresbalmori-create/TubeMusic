<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeMusic</title>
    <style>
        /* Estilos generales */
        body {
            background-color: #121212; /* Fondo oscuro */
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra superior */
        .header {
            background-color: #9b51e0; /* Violeta */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .header-icon {
            cursor: pointer;
            font-size: 20px;
        }

        /* Contenedor principal */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Inputs y Botones */
        input[type="text"] {
            width: 90%;
            max-width: 500px;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        button {
            width: 90%;
            max-width: 500px;
            padding: 15px;
            background: #9b51e0;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
            border-radius: 12px; /* Botones bien redondeados como en la captura */
            margin-bottom: 15px;
            cursor: pointer;
        }

        button:active {
            background: #7a3bbb;
        }

        /* Menú de anuncios (Oculto por defecto) */
        #adMenu {
            display: none; 
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        #adMenu h3 {
            margin-bottom: 25px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .btn-volver {
            margin-top: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            color: #ccc;
        }
    </style>
</head>
<body>

    <!-- Barra superior -->
    <div class="header">
        <span id="timerDisplay">00:04:10</span>
        <span class="header-icon" onclick="abrirMenu()">🔧</span>
    </div>

    <!-- Vista Principal: Descargas -->
    <div id="mainView" class="content">
        <input type="text" id="urlInput" placeholder="https://youtu.be/...">
        <button onclick="iniciarDescarga()">DESCARGAR MP3</button>
    </div>

    <!-- Vista Secundaria: Menú de Anuncios -->
    <div id="adMenu" class="content">
        <h3>CONSEGUIR TIEMPO</h3>
        <button onclick="verAnuncio(15)">+15 SEGUNDOS (ANUNCIO CORTO)</button>
        <button onclick="verAnuncio(30)">+30 SEGUNDOS (ANUNCIO MEDIO)</button>
        <button onclick="verAnuncio(300)">+5 MINUTOS (ANUNCIO LARGO)</button>
        <button onclick="verAnuncio(1800)">+30 MINUTOS (PASE EXTENDIDO)</button>
        <button onclick="verAnuncio(3600)">+1 HORA (PASE PREMIUM)</button>
        
        <div class="btn-volver" onclick="volverPrincipal()">VOLVER</div>
    </div>

    <!-- Lógica de la app -->
    <script>
        // Funciones de navegación de la interfaz
        function abrirMenu() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('adMenu').style.display = 'flex';
        }

        function volverPrincipal() {
            document.getElementById('adMenu').style.display = 'none';
            document.getElementById('mainView').style.display = 'flex';
        }

        // Funciones conectadas a Android
        function iniciarDescarga() {
            let url = document.getElementById('urlInput').value;
            
            // Verificamos si existe el puente de Android que creaste en Java
            if (window.AndroidBridge) {
                window.AndroidBridge.mostrarToast("Iniciando descarga en segundo plano...");
                // Acá luego agregaremos la lógica que se conecta a tu VPS
            } else {
                alert("Simulando descarga web: " + url);
            }
        }

        function verAnuncio(segundos) {
            if (window.AndroidBridge) {
                // Llama a una función en Java para mostrar el anuncio (a programar luego)
                window.AndroidBridge.mostrarToast("Cargando anuncio de " + segundos + " segundos...");
            } else {
                alert("Simulando anuncio por " + segundos + " segundos.");
            }
        }
    </script>
</body>
</html>
